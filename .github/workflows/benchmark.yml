name: Benchmark

# One prepared fleet for the entire suite. Fresh players for each case, all cases sequential.
# Loadgen processes share only their own (unmeasured) runner. Workers not needed in a smaller
# session sit out. Completion acknowledgements gate the next case; uploads happen after the suite.

on:
  workflow_dispatch:
    inputs:
      netcodes:
        description: "Comma-separated netcodes (Fusion runs last in each session)"
        required: true
        default: "purrnet,fishnet,mirror,ngo,fusion"
      sessions:
        description: "Sequential connections@tickHz sessions; empty uses size and tick_rate"
        default: ""
      size:
        description: "Connections when sessions is empty"
        default: "10"
      tick_rate:
        description: "Tick rate when sessions is empty (0 preserves project configuration)"
        default: "20"
      tag:
        description: "Result tag when sessions is empty"
        default: "solo"
      measured_clients:
        description: "Single-process measured client runners"
        default: "10"
      loadgen_procs:
        description: "Processes per unmeasured loadgen runner"
        default: "12"
      fusion_max_clients:
        description: "Fusion connection cap (Photon CCU plan limit)"
        default: "100"
      bench_seconds:
        description: "Measurement seconds per test (Idle and Static remain 5)"
        default: "10"
      bench_objects:
        description: "Objects per test"
        default: "100"
      build_players:
        description: "Build players (off requires player artifacts already in this workflow run)"
        type: boolean
        default: true
      profiling:
        description: "Development builds"
        type: boolean
        default: false
      runner:
        description: "Build and measured-client runner label"
        default: "ubuntu-latest"
      loadgen_runner:
        description: "Loadgen runner label (empty uses runner)"
        default: ""
      server_runner:
        description: "Server runner label (empty uses runner)"
        default: "bench-server"
      region:
        description: "Photon Cloud region"
        default: "eu"
  workflow_call:
    inputs:
      netcodes:
        type: string
        required: true
      sessions:
        type: string
        default: ""
      size:
        type: string
        default: "10"
      tick_rate:
        type: string
        default: "20"
      tag:
        type: string
        default: "solo"
      measured_clients:
        type: string
        default: "10"
      loadgen_procs:
        type: string
        default: "12"
      fusion_max_clients:
        type: string
        default: "100"
      bench_seconds:
        type: string
        default: "10"
      bench_objects:
        type: string
        default: "100"
      build_players:
        type: boolean
        default: false
      profiling:
        type: boolean
        default: false
      runner:
        type: string
        default: "ubuntu-latest"
      loadgen_runner:
        type: string
        default: ""
      server_runner:
        type: string
        default: ""
      region:
        type: string
        default: "eu"

env:
  SERVER_HOST: nb-srv-${{ github.run_id }}-${{ github.run_attempt }}-fleet
  BENCH_PORT: "7777"
  PHASE_PORT: "8788"
  BENCH_SECONDS: ${{ inputs.bench_seconds }}
  BENCH_OBJECTS: ${{ inputs.bench_objects }}
  PHOTON_REGION: ${{ inputs.region }}
  PHOTON_APP_ID: ${{ secrets.PHOTON_APP_ID }}

jobs:
  prep:
    name: Plan fleet
    runs-on: ubuntu-latest
    outputs:
      netcode_matrix: ${{ steps.plan.outputs.netcode_matrix }}
      worker_matrix: ${{ steps.plan.outputs.worker_matrix }}
      plan: ${{ steps.plan.outputs.plan }}
      server_runner: ${{ steps.plan.outputs.server_runner }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          NETCODES: ${{ inputs.netcodes }}
          SESSIONS: ${{ inputs.sessions }}
          SIZE: ${{ inputs.size }}
          TICK_RATE: ${{ inputs.tick_rate }}
          TAG: ${{ inputs.tag }}
          MEASURED_CLIENTS: ${{ inputs.measured_clients }}
          LOADGEN_PROCS: ${{ inputs.loadgen_procs }}
          FUSION_MAX_CLIENTS: ${{ inputs.fusion_max_clients }}
          RUNNER: ${{ inputs.runner }}
          LOADGEN_RUNNER: ${{ inputs.loadgen_runner }}
          SERVER_RUNNER: ${{ inputs.server_runner }}
        run: python3 .github/scripts/bench-fleet.py plan

  build:
    name: Build
    needs: prep
    if: ${{ inputs.build_players }}
    strategy:
      fail-fast: false
      matrix:
        netcode: ${{ fromJSON(needs.prep.outputs.netcode_matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      netcode: ${{ matrix.netcode }}
      profiling: ${{ inputs.profiling }}
      runner: ${{ inputs.runner }}

  server:
    name: Server (all sessions)
    needs: [prep, build]
    if: ${{ !cancelled() && needs.prep.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ${{ needs.prep.outputs.server_runner }}
    timeout-minutes: 360
    env:
      PLAN: ${{ needs.prep.outputs.plan }}
    steps:
      - &checkout
        uses: actions/checkout@v7
      - &download_players
        name: Download runtime players once
        uses: actions/download-artifact@v8
        with:
          pattern: player-*
          path: players
      - &prepare_players
        name: Prepare all sessions before joining the fleet
        run: |
          sudo apt-get update -qq && sudo apt-get install -y xvfb >/dev/null
          python3 .github/scripts/bench-fleet.py prepare
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs) x$(nproc)"
      - name: Connect Tailscale
        id: tailscale
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: ${{ env.SERVER_HOST }}
      - name: Connect Tailscale (retry)
        if: steps.tailscale.outcome == 'failure'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: ${{ env.SERVER_HOST }}
      - name: Run sequential suite with process-exit barriers
        run: |
          export CONTROL_BIND="$(tailscale ip -4 | head -n1)"
          test -n "$CONTROL_BIND"
          python3 .github/scripts/bench-fleet.py server
      - name: Upload all server results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-result-fleet-server
          path: |
            results/
            logs/
          if-no-files-found: warn
          retention-days: 14

  workers:
    name: ${{ matrix.id }} (all sessions)
    # Matrix concurrency is the client/loadgen population of ONE benchmark, not parallel cases.
    needs: [prep, build]
    if: ${{ !cancelled() && needs.prep.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep.outputs.worker_matrix) }}
    env:
      PLAN: ${{ needs.prep.outputs.plan }}
      WORKER_ID: ${{ matrix.id }}
    steps:
      - *checkout
      - *download_players
      - *prepare_players
      - name: Connect Tailscale
        id: tailscale
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: nb-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}-fleet
      - name: Connect Tailscale (retry)
        if: steps.tailscale.outcome == 'failure'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: nb-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}-fleet
      - name: Resolve coordinator and run fresh players for each case
        id: suite
        run: |
          for i in $(seq 1 300); do
            SERVER_IP=$(tailscale ip -4 "$SERVER_HOST" 2>/dev/null | head -n1) || true
            if [ -n "$SERVER_IP" ]; then break; fi
            sleep 2
          done
          test -n "$SERVER_IP"
          export SERVER_IP
          python3 .github/scripts/bench-fleet.py worker
      - name: Upload all worker results after the suite
        # An unexpected network/process failure must not begin uploads during another measurement.
        if: ${{ always() && steps.suite.outputs.released == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.role == 'loadgen' && 'bench-log' || 'bench-result' }}-fleet-${{ matrix.id }}
          path: |
            results/
            logs/
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Aggregate all sessions
    needs: [prep, server, workers]
    if: ${{ always() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ needs.prep.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - name: Download measured results
        uses: actions/download-artifact@v8
        with:
          pattern: bench-result-fleet-*
          path: all
          merge-multiple: true
      - name: Render per-session datapoints
        run: |
          jq -c '.cases[]' <<< "$PLAN" | while IFS= read -r entry; do
            NETCODE=$(jq -r .netcode <<< "$entry")
            TAG=$(jq -r .tag <<< "$entry")
            TOTAL=$(jq -r .total <<< "$entry")
            DIR="all/results/$TAG/$NETCODE"
            if [ ! -s "$DIR/server.json" ] && [ ! -s "$DIR/process-server.json" ]; then
              echo "::warning::Missing server result for $TAG/$NETCODE"
              continue
            fi
            bash .github/scripts/bench-aggregate.sh "$DIR" "$NETCODE" "$TOTAL" "$TAG" \
              "$BENCH_SECONDS" "$BENCH_OBJECTS" scaling
          done
      - name: Upload scaling datapoints
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-scaling-fleet
          path: scaling/
          if-no-files-found: ignore
          retention-days: 14
