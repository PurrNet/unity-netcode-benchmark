name: Prediction Benchmark

on:
  workflow_dispatch:
    inputs:
      reuse_run:
        description: "Optional existing player run ID; reuse its frozen sources and build settings"
        default: ""
        required: false
      purrdiction_run:
        description: "Optional PurrDiction player override run; reuse_run supplies the other adapters"
        default: ""
        required: false
      baseline_run:
        description: "Optional existing PurrDiction run ID for revision A/B mode"
        default: ""
        required: false
      candidate_run:
        description: "Existing candidate run ID when baseline_run selects revision A/B mode"
        default: ""
        required: false
      revision_solution:
        description: "Prediction policy for revision A/B mode"
        type: choice
        options: ["purrdiction", "purrdiction-owned"]
        default: "purrdiction"
      profile_run:
        description: "Optional existing player run ID for native sampling; select one adapter and one workload"
        default: ""
        required: false
      profile_all_threads:
        description: "Sample every selected player's threads in native profile mode"
        type: boolean
        default: false
      solutions:
        description: "Prediction adapters: purrdiction,purrdiction-owned,fishnet,fusion (owned is optional)"
        default: "purrdiction,fishnet,fusion"
        required: true
      client_counts:
        description: "Client counts; every peer is measured on the same runner"
        default: "1,2,4"
        required: true
      tick_rates:
        description: "Tick rates in Hz"
        default: "20,60"
        required: true
      object_counts:
        description: "Fixed total predicted-object populations, independent of client count"
        default: "32,128"
        required: true
      seconds:
        description: "Measurement seconds per case (after 3 seconds warmup)"
        default: "10"
        required: true
      repeats:
        description: "Fresh-process repeats per case"
        default: "3"
        required: true
      warmup_seconds:
        description: "Warmup seconds before measuring (use 20 for filled histories)"
        default: "3"
        required: true
      purrdiction_ref:
        description: "PurrDiction source branch, tag or commit; pinned before building"
        default: "dev"
        required: true
      profiling:
        description: "Development build for allocation counters; record this when comparing runs"
        type: boolean
        default: true
      diagnostics:
        description: "Detailed pass telemetry: auto enables it in development players only"
        type: choice
        options: ["auto", "on", "off"]
        default: "off"
      runner:
        description: "Runner for sequential measurements; all processes share its hardware"
        default: "ubuntu-latest"
        required: true
      region:
        description: "Photon Cloud region (Fusion Server mode)"
        default: "eu"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  plan:
    if: inputs.baseline_run == '' && inputs.profile_run == ''
    runs-on: ubuntu-latest
    outputs:
      solutions: ${{ steps.plan.outputs.solutions }}
      prediction_sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate independent prediction matrix
        id: plan
        env:
          SOLUTIONS: ${{ inputs.solutions }}
          CLIENTS: ${{ inputs.client_counts }}
          TICKS: ${{ inputs.tick_rates }}
          OBJECTS: ${{ inputs.object_counts }}
          SECONDS: ${{ inputs.seconds }}
          REPEATS: ${{ inputs.repeats }}
          WARMUP: ${{ inputs.warmup_seconds }}
          DIAGNOSTICS: ${{ inputs.diagnostics }}
          REUSE_RUN: ${{ inputs.reuse_run }}
          PURRDICTION_RUN: ${{ inputs.purrdiction_run }}
        run: |
          python3 .github/scripts/prediction-bench.py --dry-run --solutions "$SOLUTIONS" --clients "$CLIENTS" --ticks "$TICKS" --objects "$OBJECTS" --seconds "$SECONDS" --repeats "$REPEATS" --warmup "$WARMUP" --diagnostics "$DIAGNOSTICS"
          python3 - <<'PY'
          import json, os
          override = os.environ['PURRDICTION_RUN'].strip()
          if override and (not override.isdecimal() or not os.environ['REUSE_RUN'].strip().isdecimal() or
                           not any(s.strip().startswith('purrdiction') for s in os.environ['SOLUTIONS'].split(','))):
              raise SystemExit('purrdiction_run requires numeric run IDs, reuse_run and a selected PurrDiction adapter')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('solutions=' + json.dumps([s.strip() for s in os.environ['SOLUTIONS'].split(',')]) + '\n')
          PY
      - name: Resolve PurrDiction once
        id: pin
        if: inputs.reuse_run == '' && contains(inputs.solutions, 'purrdiction')
        env:
          PREDICTION_REF: ${{ inputs.purrdiction_ref }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          ref = os.environ['PREDICTION_REF'].strip()
          if re.fullmatch(r'[0-9a-fA-F]{40}', ref):
              sha = ref.lower()
          else:
              result = subprocess.check_output(['git', 'ls-remote', 'https://github.com/PurrNet/PurrDiction.git', 'refs/heads/' + ref, 'refs/tags/' + ref, 'refs/tags/' + ref + '^{}'], text=True)
              refs = dict(line.split('\t')[::-1] for line in result.splitlines() if '\t' in line)
              sha = next((refs[name] for name in ('refs/tags/' + ref + '^{}', 'refs/tags/' + ref, 'refs/heads/' + ref) if name in refs), None)
              if not sha: raise SystemExit('PurrDiction ref not found')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output: output.write('sha=' + sha + '\n')
          PY

  build:
    if: inputs.reuse_run == ''
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        solution: ${{ fromJSON(needs.plan.outputs.solutions) }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned prediction source
        if: startsWith(matrix.solution, 'purrdiction')
        uses: actions/checkout@v7
        with:
          repository: PurrNet/PurrDiction
          ref: ${{ needs.plan.outputs.prediction_sha }}
          path: prediction-source
      - name: Generate isolated project
        env:
          SOLUTION: ${{ matrix.solution }}
        run: python3 .github/scripts/prediction-prepare.py "$SOLUTION" --output "prediction-projects/$SOLUTION" --prediction-source prediction-source
      - name: Restore prediction Library
        uses: actions/cache@v6
        with:
          path: prediction-projects/${{ matrix.solution }}/Library
          key: Prediction-Library-${{ matrix.solution }}-${{ inputs.profiling && 'dev' || 'rel' }}-${{ hashFiles('prediction-projects/**/Assets/**', 'prediction-projects/**/Packages/**', 'prediction-projects/**/ProjectSettings/**', 'prediction/**', '.github/workflows/prediction.yml') }}
          restore-keys: Prediction-Library-${{ matrix.solution }}-${{ inputs.profiling && 'dev' || 'rel' }}-
      - name: Build dedicated prediction player
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: prediction-projects/${{ matrix.solution }}
          targetPlatform: StandaloneLinux64
          buildName: PredictionBench
          linux64RemoveExecutableExtension: true
          buildsPath: build
          unityVersion: auto
          allowDirtyBuild: true
          buildMethod: PredictionBench.Editor.PredictionBenchBuild.BuildLinux
          customParameters: ${{ inputs.profiling && '-devBuild' || '' }}
      - name: Upload prediction player
        uses: actions/upload-artifact@v7
        with:
          name: prediction-player-${{ matrix.solution }}
          path: build/StandaloneLinux64/
          if-no-files-found: error
          retention-days: 3
      - name: Upload source provenance and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prediction-build-${{ matrix.solution }}
          path: |
            prediction-projects/${{ matrix.solution }}/prediction-provenance.json
            prediction-projects/${{ matrix.solution }}/Logs/
          retention-days: 14

  benchmark:
    # Hosted loopback jobs have separate VMs; keep Fusion and custom runners serialized.
    concurrency:
      group: ${{ inputs.runner == 'ubuntu-latest' && !contains(inputs.solutions, 'fusion') && format('prediction-hosted-{0}', github.run_id) || 'netcode-scaling-bench' }}
      cancel-in-progress: false
      queue: max
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.build.result == 'success' || inputs.reuse_run != '') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: prediction-player-*
          path: downloaded-players
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download frozen PurrDiction overrides
        if: inputs.purrdiction_run != ''
        uses: actions/download-artifact@v8
        with:
          pattern: prediction-player-purrdiction*
          path: overridden-players
          run-id: ${{ inputs.purrdiction_run }}
          github-token: ${{ github.token }}
      - name: Arrange independent players
        env:
          SOLUTIONS: ${{ inputs.solutions }}
          PURRDICTION_RUN: ${{ inputs.purrdiction_run }}
        run: |
          override=()
          if [[ -n "$PURRDICTION_RUN" ]]; then override=(--purrdiction-source overridden-players); fi
          python3 .github/scripts/prediction-arrange.py --solutions "$SOLUTIONS" "${override[@]}"
      - name: Run sequential prediction cases
        env:
          SOLUTIONS: ${{ inputs.solutions }}
          CLIENTS: ${{ inputs.client_counts }}
          TICKS: ${{ inputs.tick_rates }}
          OBJECTS: ${{ inputs.object_counts }}
          SECONDS: ${{ inputs.seconds }}
          REPEATS: ${{ inputs.repeats }}
          WARMUP: ${{ inputs.warmup_seconds }}
          REGION: ${{ inputs.region }}
          DIAGNOSTICS: ${{ inputs.diagnostics }}
        run: python3 .github/scripts/prediction-bench.py --solutions "$SOLUTIONS" --clients "$CLIENTS" --ticks "$TICKS" --objects "$OBJECTS" --seconds "$SECONDS" --repeats "$REPEATS" --warmup "$WARMUP" --region "$REGION" --diagnostics "$DIAGNOSTICS"
      - name: Render separate prediction report
        if: always()
        run: |
          python3 .github/scripts/prediction-report.py prediction-results prediction-report
          cat prediction-report/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload prediction results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prediction-benchmark-results
          path: |
            prediction-results/
            prediction-report/
          if-no-files-found: error
          retention-days: 30

  revision_compare:
    concurrency:
      # Each standard hosted job has its own VM; custom runners retain the shared lock.
      group: ${{ inputs.runner == 'ubuntu-latest' && format('prediction-hosted-{0}', github.run_id) || 'netcode-scaling-bench' }}
      cancel-in-progress: false
      queue: max
    if: inputs.baseline_run != '' && inputs.profile_run == ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: prediction-player-${{ inputs.revision_solution }}
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: prediction-players/baseline/${{ inputs.revision_solution }}
      - uses: actions/download-artifact@v8
        with:
          name: prediction-player-${{ inputs.revision_solution }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: prediction-players/candidate/${{ inputs.revision_solution }}
      - name: Run alternating revisions
        env:
          SOLUTION: ${{ inputs.revision_solution }}
          CLIENTS: ${{ inputs.client_counts }}
          TICKS: ${{ inputs.tick_rates }}
          OBJECTS: ${{ inputs.object_counts }}
          SECONDS: ${{ inputs.seconds }}
          WARMUP: ${{ inputs.warmup_seconds }}
          REPEATS: ${{ inputs.repeats }}
          DIAGNOSTICS: ${{ inputs.diagnostics }}
        run: |
          chmod +x "prediction-players/baseline/$SOLUTION/PredictionBench" "prediction-players/candidate/$SOLUTION/PredictionBench"
          python3 .github/scripts/prediction-ab.py --solution "$SOLUTION" --baseline prediction-players/baseline --candidate prediction-players/candidate --clients "$CLIENTS" --ticks "$TICKS" --objects "$OBJECTS" --seconds "$SECONDS" --warmup "$WARMUP" --repeats "$REPEATS" --diagnostics "$DIAGNOSTICS"
      - name: Report both revisions
        if: always()
        run: |
          for variant in baseline candidate; do
            python3 .github/scripts/prediction-report.py "prediction-ab-results/$variant" "prediction-ab-report/$variant"
            echo "## $variant" >> "$GITHUB_STEP_SUMMARY"
            cat "prediction-ab-report/$variant/latest.md" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prediction-revision-comparison-results
          path: |
            prediction-ab-results/
            prediction-ab-report/
          if-no-files-found: error
          retention-days: 30

  native_profile:
    if: inputs.profile_run != ''
    concurrency:
      group: ${{ inputs.runner == 'ubuntu-latest' && startsWith(inputs.solutions, 'purrdiction') && format('prediction-hosted-{0}', github.run_id) || 'netcode-scaling-bench' }}
      cancel-in-progress: false
      queue: max
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate one diagnostic workload
        env:
          SOLUTION: ${{ inputs.solutions }}
          PLAYER_RUN: ${{ inputs.profile_run }}
          CLIENTS: ${{ inputs.client_counts }}
          TICKS: ${{ inputs.tick_rates }}
          OBJECTS: ${{ inputs.object_counts }}
          SECONDS: ${{ inputs.seconds }}
          WARMUP: ${{ inputs.warmup_seconds }}
          ALL_THREADS: ${{ inputs.profile_all_threads }}
        run: |
          scope=()
          if [[ "$ALL_THREADS" == 'true' ]]; then scope=(--all-threads); fi
          python3 .github/scripts/prediction-profile.py --dry-run --solution "$SOLUTION" --player-run "$PLAYER_RUN" --players profile-players --clients "$CLIENTS" --ticks "$TICKS" --objects "$OBJECTS" --seconds "$SECONDS" --warmup "$WARMUP" "${scope[@]}"
      - uses: actions/download-artifact@v8
        with:
          name: prediction-player-${{ inputs.solutions }}
          run-id: ${{ inputs.profile_run }}
          github-token: ${{ github.token }}
          path: profile-players/${{ inputs.solutions }}
      - name: Install native sampler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-generic
          profiler=$(find /usr/lib/linux-tools* -type f -name perf | sort -V | tail -n 1)
          test -x "$profiler"
          "$profiler" --version
          echo "NATIVE_PERF=$profiler" >> "$GITHUB_ENV"
      - name: Capture native stacks
        env:
          SOLUTION: ${{ inputs.solutions }}
          PLAYER_RUN: ${{ inputs.profile_run }}
          CLIENTS: ${{ inputs.client_counts }}
          TICKS: ${{ inputs.tick_rates }}
          OBJECTS: ${{ inputs.object_counts }}
          SECONDS: ${{ inputs.seconds }}
          WARMUP: ${{ inputs.warmup_seconds }}
          REGION: ${{ inputs.region }}
          ALL_THREADS: ${{ inputs.profile_all_threads }}
        run: |
          chmod +x "profile-players/$SOLUTION/PredictionBench"
          scope=()
          if [[ "$ALL_THREADS" == 'true' ]]; then scope=(--all-threads); fi
          sudo python3 .github/scripts/prediction-profile.py --solution "$SOLUTION" --player-run "$PLAYER_RUN" --players profile-players --perf "$NATIVE_PERF" --clients "$CLIENTS" --ticks "$TICKS" --objects "$OBJECTS" --seconds "$SECONDS" --warmup "$WARMUP" --region "$REGION" "${scope[@]}"
      - name: Make diagnostic output readable by the runner
        if: always()
        run: |
          if test -d prediction-native-profile; then
            sudo chown -R "$(id -u):$(id -g)" prediction-native-profile
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prediction-native-profile
          path: prediction-native-profile/
          if-no-files-found: error
          retention-days: 14
