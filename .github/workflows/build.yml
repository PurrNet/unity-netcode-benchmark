name: Build player

# Builds one netcode project (fishnet / fusion / mirror / ngo / purrnet) as a StandaloneLinux64
# IL2CPP player and uploads it as `player-<netcode>`. Called by scaling.yml once per netcode; the
# benchmark runs then reuse the same artifact for every connection count.

on:
  workflow_call:
    inputs:
      netcode:
        type: string
        required: true
      profiling:
        description: "Development build (live profiler samplers -> CPU-by-marker table)"
        type: boolean
        required: false
        default: false
      runner:
        type: string
        required: false
        default: ubuntu-latest
      purrnet_ref:
        description: "PurrNet branch, tag or commit to build (purrnet only; empty keeps the committed manifest)"
        type: string
        required: false
        default: dev
  workflow_dispatch:
    inputs:
      netcode:
        description: "Project folder to build"
        type: choice
        required: true
        options: [purrnet, fishnet, mirror, ngo, fusion]
      profiling:
        type: boolean
        required: false
        default: false
      runner:
        type: string
        required: false
        default: ubuntu-latest
      purrnet_ref:
        description: "PurrNet branch, tag or commit to build (purrnet only; empty keeps the committed manifest)"
        type: string
        required: false
        default: dev

jobs:
  build:
    name: Build ${{ inputs.netcode }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    # Builds of the same player wait for each other instead of compiling side by side (a benchmark
    # dispatched while a hand-started build runs): the second starts once the first has saved the
    # finished player, and restores it when the inputs match. A waiting job holds no runner.
    # GitHub keeps one waiting job per group, so a third concurrent build of the same player
    # cancels the one already waiting.
    concurrency:
      group: player-build-${{ inputs.netcode }}-${{ inputs.profiling && 'dev' || 'rel' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # PurrNet follows a ref (dev by default) rather than a committed tag. The manifest is pinned to
      # the ref's commit before any cache key is computed, so a new PurrNet commit builds a new player
      # and an unchanged one reuses the cached player. scaling.yml resolves the ref once and passes the
      # commit, so the build and the reported version agree even if dev moves mid-run.
      - name: Pin PurrNet
        if: ${{ inputs.netcode == 'purrnet' && inputs.purrnet_ref != '' }}
        env:
          PURRNET_REF: ${{ inputs.purrnet_ref }}
        run: |
          sha=$(python3 .github/scripts/pin-purrnet.py --write "$PURRNET_REF")
          echo "PurrNet $PURRNET_REF -> $sha"

      # No restore prefix: a finished player is reusable only for identical build inputs.
      # ProjectSettings includes the Unity version; the workflow includes the builder/configuration.
      # Keep staging outside build/: Unity's Docker container can leave that directory root-owned.
      - name: Restore finished player
        id: cache-player
        uses: actions/cache/restore@v6
        with:
          path: player-package/
          key: Player-v1-Linux-IL2CPP-${{ inputs.netcode }}-${{ inputs.profiling && 'dev' || 'rel' }}-${{ hashFiles(format('{0}/Assets/**', inputs.netcode), format('{0}/Packages/**', inputs.netcode), format('{0}/ProjectSettings/**', inputs.netcode), 'Shared/**', '.github/workflows/build.yml', '.github/scripts/package-player.py') }}

      # GitHub's cache (10 GB per repo). The Blacksmith drop-in used before this does not fall back
      # on GitHub-hosted runners despite its docs: restore and save both fail with 401.
      - name: Restore Library cache
        if: steps.cache-player.outputs.cache-hit != 'true'
        id: cache-library
        uses: actions/cache/restore@v6
        with:
          path: ${{ inputs.netcode }}/Library
          key: Library-${{ inputs.netcode }}-${{ inputs.profiling && 'dev' || 'rel' }}-${{ hashFiles(format('{0}/Assets/**', inputs.netcode), format('{0}/Packages/**', inputs.netcode), format('{0}/ProjectSettings/**', inputs.netcode), 'Shared/**') }}
          restore-keys: |
            Library-${{ inputs.netcode }}-${{ inputs.profiling && 'dev' || 'rel' }}-

      - name: Build StandaloneLinux64 player (IL2CPP)
        if: steps.cache-player.outputs.cache-hit != 'true'
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ inputs.netcode }}
          targetPlatform: StandaloneLinux64
          buildName: NetBench
          # v5 otherwise adds .x86_64; packaging and launch scripts expect the existing NetBench name.
          linux64RemoveExecutableExtension: true
          buildsPath: build
          unityVersion: auto
          # Pin PurrNet rewrites the manifest on purpose. game-ci otherwise refuses a checkout with
          # uncommitted changes (it derives a semantic version from git; nothing here reads it).
          allowDirtyBuild: true
          # Custom method: game-ci has no development-build toggle. Flags travel on the Unity
          # command line (customParameters) because the build container only forwards an env allowlist.
          buildMethod: PurrNet.NetBench.Editor.CIBuild.BuildLinuxPlayer
          customParameters: ${{ inputs.profiling && '-devBuild' || '' }}

      - name: Save Library cache
        if: ${{ !cancelled() && steps.cache-player.outputs.cache-hit != 'true' && steps.cache-library.outcome == 'success' && steps.cache-library.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ inputs.netcode }}/Library
          key: ${{ steps.cache-library.outputs.cache-primary-key }}

      - name: Separate runtime and build diagnostics
        if: steps.cache-player.outputs.cache-hit != 'true'
        env:
          PLAYER_KEY: ${{ steps.cache-player.outputs.cache-primary-key }}
        run: python3 .github/scripts/package-player.py package --key "$PLAYER_KEY" --revision "$GITHUB_SHA"

      - name: Verify finished player
        env:
          PLAYER_KEY: ${{ steps.cache-player.outputs.cache-primary-key }}
        run: python3 .github/scripts/package-player.py verify --key "$PLAYER_KEY"

      - name: Save finished player
        if: steps.cache-player.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: player-package/
          key: ${{ steps.cache-player.outputs.cache-primary-key }}

      - name: Upload player artifact
        uses: actions/upload-artifact@v7
        with:
          name: player-${{ inputs.netcode }}
          path: player-package/runtime/
          if-no-files-found: error
          retention-days: 1

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-${{ inputs.netcode }}
          path: |
            player-package/diagnostics/
            player-package/runtime/build-provenance.json
          if-no-files-found: error
          retention-days: 14
