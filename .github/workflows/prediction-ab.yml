name: Prediction Revision Comparison

on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: "Successful prediction workflow run containing the baseline PurrDiction player"
        default: "38609933293"
        required: true
      candidate_run:
        description: "Successful prediction workflow run containing the candidate PurrDiction player"
        default: "38617763186"
        required: true
      client_counts:
        default: "4"
        required: true
      tick_rates:
        default: "60"
        required: true
      object_counts:
        default: "128"
        required: true
      seconds:
        default: "20"
        required: true
      warmup_seconds:
        default: "20"
        required: true
      repeats:
        default: "5"
        required: true
      runner:
        default: "ubuntu-latest"
        required: true

concurrency:
  group: netcode-scaling-bench
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: prediction-player-purrdiction
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: prediction-players/baseline/purrdiction
      - uses: actions/download-artifact@v8
        with:
          name: prediction-player-purrdiction
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: prediction-players/candidate/purrdiction
      - name: Run alternating revisions
        env:
          CLIENTS: ${{ inputs.client_counts }}
          TICKS: ${{ inputs.tick_rates }}
          OBJECTS: ${{ inputs.object_counts }}
          SECONDS: ${{ inputs.seconds }}
          WARMUP: ${{ inputs.warmup_seconds }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          chmod +x prediction-players/{baseline,candidate}/purrdiction/PredictionBench
          python3 .github/scripts/prediction-ab.py --baseline prediction-players/baseline --candidate prediction-players/candidate --clients "$CLIENTS" --ticks "$TICKS" --objects "$OBJECTS" --seconds "$SECONDS" --warmup "$WARMUP" --repeats "$REPEATS"
      - name: Report both revisions
        if: always()
        run: |
          for variant in baseline candidate; do
            python3 .github/scripts/prediction-report.py "prediction-ab-results/$variant" "prediction-ab-report/$variant"
            echo "## $variant" >> "$GITHUB_STEP_SUMMARY"
            cat "prediction-ab-report/$variant/latest.md" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prediction-revision-comparison-results
          path: |
            prediction-ab-results/
            prediction-ab-report/
          if-no-files-found: error
          retention-days: 30
